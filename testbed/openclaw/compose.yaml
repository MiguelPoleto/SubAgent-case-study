name: openclaw-testbed

services:
  gateway:
    build:
      context: ./gateway
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.9.3}
    image: openclaw-testbed-gateway:local
    container_name: openclaw-testbed-gateway
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    environment:
      HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Defina OPENCLAW_GATEWAY_TOKEN no arquivo .env local}
    volumes:
      # Estes bind mounts são necessários para que o Gateway traduza os mounts
      # dos sandboxes irmãos criados pelo daemon Docker do host (DooD).
      - ./runtime/state:/home/node/.openclaw
      - ./runtime/workspace:/home/node/.openclaw/workspace
      - ./runtime/auth-profile-secrets:/home/node/.config/openclaw
      # Somente o Gateway confiável recebe acesso ao daemon; o agente não.
      - ${OPENCLAW_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?Defina DOCKER_GID (stat -c '%g' /var/run/docker.sock) no arquivo .env local}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /run:mode=755
    networks:
      - gateway
    entrypoint: ["node", "dist/index.js"]
    command: ["gateway", "--bind", "lan", "--port", "18789"]

  # Perfil utilitário: constrói a imagem exigida pelo sandbox sem iniciar
  # um serviço. Execute: docker compose --profile build build sandbox-image
  sandbox-image:
    profiles: ["build"]
    build:
      context: ./sandbox
    image: openclaw-testbed-sandbox:bookworm-slim
    command: ["true"]
    networks: []

networks:
  gateway:
    name: openclaw-testbed-gateway
