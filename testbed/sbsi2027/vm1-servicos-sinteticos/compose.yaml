name: sbsi2027-synthetic-services

services:
  web-sintetico:
    image: ${NGINX_IMAGE:?Defina NGINX_IMAGE com tag/digest validado em .env}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,noexec,mode=1777
      - /run:rw,nosuid,nodev,noexec,mode=1777
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./runtime/site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [synthetic]

  mailpit:
    image: ${MAILPIT_IMAGE:?Defina MAILPIT_IMAGE com tag/digest validado em .env}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks: [synthetic]

networks:
  synthetic:
    internal: false
